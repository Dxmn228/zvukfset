[pytest]
junit_family = xunit1
testpaths = tests/hosting
python_files = hosting_*.py
pythonpath = tests/hosting
addopts = -p no:django -p no:cacheprovider --tb=short --show-capture=no
markers =
    functional: published application functions via HTTP
    browser: real browser checks, enable with --hosting-browser
    writes: creates a dedicated demonstration account and order, enable with --hosting-writes
