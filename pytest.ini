[pytest]
junit_family = xunit1
testpaths = tests/hosting
pythonpath = tests/hosting
python_files = hosting_*.py
addopts = -p no:django -p no:cacheprovider --tb=short --show-capture=no --hosting-browser --hosting-writes --browser chromium --browser firefox
markers =
    functional: published application functions via HTTP
    browser: published website in a real browser
    writes: dedicated test accounts and demonstration records
